# Paste as a manual dashboard (or copy the individual cards).
# Entity IDs below are suggestions:
# HA can choose different IDs, especially if entities already existed.
title: Tenko Boiler
views:
  - title: Boiler
    path: tenko
    cards:
      - type: entities
        title: Live readings
        entities:
          - sensor.tenko_boiler_air_temperature
          - sensor.tenko_boiler_flow_temperature
          - sensor.tenko_boiler_return_temperature
          - sensor.tenko_boiler_pressure
          - binary_sensor.tenko_boiler_heating_element_1
          - binary_sensor.tenko_boiler_heating_element_2
          - sensor.tenko_boiler_modulated_power
          - sensor.tenko_boiler_pump
          - sensor.tenko_boiler_af_5
          - sensor.tenko_boiler_boiler_clock
          - sensor.tenko_boiler_boiler_date
          - sensor.tenko_boiler_boiler_weekday
          - sensor.tenko_boiler_error_code
      - type: thermostat
        entity: climate.tenko_boiler_constant_temperature
      - type: entities
        title: Settings
        entities:
          - select.tenko_boiler_control_mode
          - switch.tenko_boiler_maintaining_minimum_temperature_mmt
          - number.tenko_boiler_mmt_min_temperature
          - number.tenko_boiler_mmt_max_temperature
          - number.tenko_boiler_flow_cutoff
          - number.tenko_boiler_flow_restart_drop
          - number.tenko_boiler_return_cutoff
          - number.tenko_boiler_return_restart_drop
          - switch.tenko_boiler_power_modulation_mode
          - switch.tenko_boiler_stage_1_mod_off_only
          - switch.tenko_boiler_stage_2_mod_off_only
          - number.tenko_boiler_pump_pre_circulation_time
          - number.tenko_boiler_pump_post_run_time
          - sensor.tenko_boiler_settings_upload_status
          - sensor.tenko_boiler_settings_command_error
      - type: entities
        title: Energy meter
        entities:
          - sensor.tenko_boiler_energy_meter_energy
  # Generated Schedule view - regenerate before customizing entity IDs.
  - title: Schedule
    path: schedule
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Schedule
          - type: entities
            title: Upload status
            entities:
              - sensor.tenko_boiler_settings_upload_status
              - sensor.tenko_boiler_settings_command_error
          - type: markdown
            content: >-
              Each numbered slot has Hour (0-23) and Target in C (0 = OFF, otherwise 7-40).
              Each valid change queues immediately. Whole week mode repeats WW every day;
              Individual days uses MO-SU. Editing does not activate a mode.
              Slots may be in any order; Schedule shows ambiguous when several slots share an hour.
              Queued uploads continue until confirmed.
      - type: grid
        cards:
          - type: heading
            heading: "WW"
          - type: entities
            show_header_toggle: false
            entities:
              - sensor.tenko_boiler_schedule_ww
